<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カラータイル</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 16px; }
  #info { margin: 8px 0; font-size: 18px; }
  #info span.sep { margin: 0 6px; color: #999; }
  #time.low { color: #d84315; font-weight: bold; }
  #msg { height: 24px; color: #d84315; font-size: 14px; }
  #board {
    display: grid; grid-template-columns: repeat(10, 1fr);
    gap: 3px; width: min(92vw, 480px); margin: 0 auto;
    background: #ddd; padding: 3px; border-radius: 6px;
  }
  .cell { aspect-ratio: 1; border-radius: 4px; }
  .tile { pointer-events: none; }
  .empty { background: #ddd; cursor: pointer; }
  .empty:hover { background: #ccc; }
  #board.over .empty { cursor: default; }
  #board.over .empty:hover { background: #ddd; }
  .shake { animation: shake .25s; }
  .hint { outline: 3px solid #000; }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  button { font-size: 15px; padding: 6px 14px; margin: 10px 4px; cursor: pointer; }
</style>
</head>
<body>
  <h1>カラータイル</h1>
  <div id="info">
    時間: <span id="time">0.0</span> 秒
    <span class="sep">／</span>得点: <span id="score">0</span>
    <span class="sep">／</span>残り: <span id="left">0</span> マス
    <span class="sep">／</span>ミス: <span id="miss">0</span>
  </div>
  <div id="msg"></div>
  <div id="board"></div>
  <button id="newBtn">新しいゲーム</button>
  <button id="hintBtn">ヒント</button>

<script>
const N = 10;
const COLORS = ["#e53935", "#fdd835", "#fb8c00", "#f48fb1", "#1e88e5", "#43a047", "#8e24aa", "#6d4c41"];
const NC = COLORS.length;
const DIRS = [[0,1],[0,-1],[1,0],[-1,0]];
const START_EMPTY = 12;   // 最初の空きマスの数
const TIME_LIMIT = 60;    // 制限時間(秒)
const MISS_PENALTY = 3;   // ミスしたときに減る時間(秒)

const idx = (r, c) => r * N + c;
const inBounds = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---- ゲームのルール ----
// 空きマスiから上下左右に見て、最初に見えるタイル
function visibleFrom(i, b) {
  const r = Math.floor(i / N), c = i % N, res = [];
  for (const [dr, dc] of DIRS) {
    let rr = r + dr, cc = c + dc;
    while (inBounds(rr, cc) && b[idx(rr, cc)] < 0) { rr += dr; cc += dc; }
    if (inBounds(rr, cc)) res.push(idx(rr, cc));
  }
  return res;
}

// 空きマスiをクリックしたときに消えるタイル(同じ色が2つ以上見えている色)
function getRemovals(i, b) {
  const by = {};
  for (const t of visibleFrom(i, b)) (by[b[t]] ||= []).push(t);
  const out = [];
  for (const k in by) if (by[k].length >= 2) out.push(...by[k]);
  return out;
}

function findAnyMove(b) {
  for (let i = 0; i < N * N; i++) {
    if (b[i] < 0) {
      const rm = getRemovals(i, b);
      if (rm.length) return { cell: i, tiles: rm };
    }
  }
  return null;
}

// ---- 必ずクリアできる盤面の生成(消す手順を逆再生する) ----
// 全マス空の状態から「空きマスcから上下左右に見える位置に、同じ色を2〜4個置く」を繰り返す。
// 置いた順の逆にcをクリックしていけば、必ず全部消せるよね。
function build(total) {
  if (total < 2) return null;
  const b = new Array(N * N).fill(-1);
  let remaining = total;
  while (remaining > 0) {
    const srcs = [];
    for (let i = 0; i < N * N; i++) if (b[i] < 0) srcs.push(i);
    shuffle(srcs);
    let done = false;
    for (const c of srcs) {
      const r = Math.floor(c / N), c0 = c % N;
      const info = DIRS.map(([dr, dc]) => {
        const list = []; let first = -1;
        let rr = r + dr, cc = c0 + dc;
        while (inBounds(rr, cc)) {
          const j = idx(rr, cc);
          if (b[j] >= 0) { first = b[j]; break; }
          list.push(j);
          rr += dr; cc += dc;
        }
        return { list, first };
      });
      const avail = [];
      info.forEach((x, k) => { if (x.list.length) avail.push(k); });
      if (avail.length < 2) continue;
      for (let tr = 0; tr < 6 && !done; tr++) {
        shuffle(avail);
        const cnts = [];
        for (let n = 2; n <= Math.min(4, avail.length, remaining); n++) if (remaining - n !== 1) cnts.push(n);
        if (!cnts.length) break;
        const cnt = cnts[rand(cnts.length)];
        const dirs = avail.slice(0, cnt);
        // 使わない方向に見えるタイルが巻き込まれないように色を選ぶ
        const others = info.map((x, k) => dirs.includes(k) ? -1 : x.first).filter(v => v >= 0);
        if (new Set(others).size !== others.length) continue;
        const allowed = [];
        for (let k = 0; k < NC; k++) if (!others.includes(k)) allowed.push(k);
        const color = allowed[rand(allowed.length)];
        const tiles = dirs.map(k => { const L = info[k].list; return L[L.length - 1]; });
        tiles.forEach(t => b[t] = color);
        remaining -= tiles.length;
        done = true;
      }
      if (done) break;
    }
    if (!done) return null;
  }
  return b;
}

function makeBoard(total) {
  for (let a = 0; a < 500; a++) { const b = build(total); if (b) return b; }
  return null;
}

// ---- 表示・状態 ----
let board = [];       // -1 = 空き, 0〜7 = 色
let miss = 0;
let score = 0;
let playing = false;
let endTime = 0;      // ゲーム終了の時刻(ミスのたびに前倒しする)
let timer = null;

const boardEl = document.getElementById("board");
const leftEl = document.getElementById("left");
const missEl = document.getElementById("miss");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const msgEl = document.getElementById("msg");

function render() {
  boardEl.innerHTML = "";
  let left = 0;
  for (let i = 0; i < N * N; i++) {
    const d = document.createElement("div");
    d.dataset.i = i;
    if (board[i] < 0) {
      d.className = "cell empty";
    } else {
      d.className = "cell tile";
      d.style.background = COLORS[board[i]];
      left++;
    }
    boardEl.appendChild(d);
  }
  leftEl.textContent = left;
  missEl.textContent = miss;
  scoreEl.textContent = score;
  boardEl.classList.toggle("over", !playing);
  return left;
}

function showTime() {
  const t = Math.max(0, (endTime - Date.now()) / 1000);
  timeEl.textContent = t.toFixed(1);
  timeEl.classList.toggle("low", t <= 10);
  return t;
}

function tick() {
  if (!playing) return;
  if (showTime() <= 0) finish("time");
}

function finish(reason) {
  playing = false;
  clearInterval(timer);
  showTime();
  boardEl.classList.add("over");
  if (reason === "clear") {
    msgEl.style.color = "#2e7d32";
    msgEl.textContent = "🎉 クリア！ 得点: " + score + " 点（残り時間 " + timeEl.textContent + " 秒）";
  } else if (reason === "time") {
    msgEl.style.color = "#d84315";
    msgEl.textContent = "⏰ 時間切れ！ 得点: " + score + " 点";
  } else {
    msgEl.style.color = "#d84315";
    msgEl.textContent = "消せるタイルがなくなりました。ゲーム終了！ 得点: " + score + " 点";
  }
}

function newGame() {
  const b = makeBoard(N * N - START_EMPTY);
  if (!b) {
    msgEl.style.color = "#d84315";
    msgEl.textContent = "盤面の生成に失敗しました。もう一度「新しいゲーム」を押してください";
    return;
  }
  board = b;
  miss = 0;
  score = 0;
  playing = true;
  msgEl.textContent = "";
  endTime = Date.now() + TIME_LIMIT * 1000;
  clearInterval(timer);
  timer = setInterval(tick, 100);
  render();
  showTime();
}

boardEl.addEventListener("click", e => {
  if (!playing) return;
  const t = e.target.closest(".empty");
  if (!t) return;
  const i = Number(t.dataset.i);
  const rm = getRemovals(i, board);

  if (!rm.length) {
    // ミス：時間を減らす
    miss++;
    missEl.textContent = miss;
    endTime -= MISS_PENALTY * 1000;
    msgEl.style.color = "#d84315";
    msgEl.textContent = "ミス！ -" + MISS_PENALTY + "秒";
    t.classList.add("shake");
    setTimeout(() => t.classList.remove("shake"), 250);
    tick();
    return;
  }

  // 消えたタイル1個につき1点
  msgEl.textContent = "";
  score += rm.length;
  rm.forEach(j => board[j] = -1);
  const left = render();

  if (left === 0) { finish("clear"); return; }
  if (!findAnyMove(board)) finish("stuck");
});

document.getElementById("newBtn").addEventListener("click", newGame);
document.getElementById("hintBtn").addEventListener("click", () => {
  if (!playing) return;
  const m = findAnyMove(board);
  if (!m) return;
  const els = [m.cell, ...m.tiles].map(j => boardEl.children[j]);
  els.forEach(el => el.classList.add("hint"));
  setTimeout(() => els.forEach(el => el.classList.remove("hint")), 1200);
});

newGame();
</script>
</body>
</html>
